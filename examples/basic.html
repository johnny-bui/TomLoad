<!doctype html>
<!--
  Feature : TomLoad — basic example
  Version : 0.1.0
  Author  : Tomdesign (Johnny Bui)
  Purpose : Smallest working setup: skeleton → loading mascot → decode in.
-->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TomLoad — basic</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f5f6f9;display:grid;place-items:center;min-height:100vh;margin:0}
  .card{width:320px;min-height:360px;padding:20px;border-radius:24px;background:#fff;border:1px solid #eceef3;position:relative;--tl-accent:#7b6cff}
  .card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:#f1f2f6}
  button{margin-top:16px;padding:10px 18px;border:0;border-radius:999px;background:#1d2130;color:#fff;font:600 14px system-ui}
</style>
</head>
<body>
<article class="card" id="card"></article>
<script src="../dist/tomload.iife.js"></script>
<script>
  /* INIT */
  const { glyph, skeleton, mascots } = TomLoad;
  const card = document.getElementById('card');

  /* 1 — skeleton paints instantly (pure HTML + CSS) */
  card.innerHTML = skeleton({ variant: 'braille', lines: 5 });

  /* 2 — data arrives: render real markup, keep it hidden, show a mascot */
  setTimeout(() => {
    card.innerHTML = `<h2>Saigon Cold Brew</h2><p>18-hour slow drip · 250 ml</p><button>Add to bag</button>`;
    const g = glyph(card, { preset: 'ink' });
    g.hide({ instant: true });
    g.loading(true, { mascot: mascots.phin });

    /* 3 — decode in */
    setTimeout(() => { g.loading(false); g.reveal({ origin: 'top', speed: .6 }); }, 1800);
  }, 1200);
</script>
</body>
</html>
