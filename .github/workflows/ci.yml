name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: cmp dist/tomload.iife.js docs/tomload.iife.js
      - run: git diff --exit-code -- dist/tomload.js dist/tomload.iife.js docs/tomload.iife.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
